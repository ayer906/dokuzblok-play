<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0B123F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Blocko">
    <title>Blocko</title>
    <link rel="icon" href="TemplateData/favicon.ico">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas>
      <div id="loading">
        <img id="loading-logo" src="TemplateData/logo.png" alt="Blocko">
        <div id="progress"><div id="progress-fill"></div></div>
      </div>
      <div id="warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var game = document.querySelector("#game");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#warning");
        var div = document.createElement("div");
        div.textContent = msg;
        div.className = type == "error" ? "error" : "warn";
        banner.appendChild(div);
        if (type != "error") setTimeout(function () { banner.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Blocko Studio",
        productName: "Blocko",
        productVersion: "0.9.0",
        showBanner: unityShowBanner,
      };

      // Telefonda oyun tüm ekranı kaplar; masaüstünde telefon oranında (9:16) ortalanmış bir pencere olur.
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      document.body.className = mobile ? "mobile" : "desktop";

      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#progress-fill");
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = 100 * progress + "%";
        }).then(function () {
          loading.classList.add("done");
          setTimeout(function () { loading.style.display = "none"; }, 400);
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
